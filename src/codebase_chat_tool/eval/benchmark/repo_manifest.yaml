# Benchmark repos for the evaluation harness, pinned at fixed commits for
# reproducibility. `package_root` is the subdirectory to index (some repos use
# a src/ layout where the actual importable package lives one level down).
repos:
  - name: requests
    url: https://github.com/psf/requests.git
    ref: v2.34.2
    commit: 6e83187b8feb273ed4c6cdab5efd8d54901dfab3
    package_root: src

  - name: flask
    url: https://github.com/pallets/flask.git
    ref: "3.1.3"
    commit: 22d924701a6ae2e4cd01e9a15bbaf3946094af65
    package_root: src

  - name: typer
    url: https://github.com/fastapi/typer.git
    ref: "0.27.1"
    commit: fe2aa0e2f9c853de378e60ca24ec3b256144decf
    package_root: "."
