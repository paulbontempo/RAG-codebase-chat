[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codebase-chat-tool"
version = "0.1.0"
description = "Agentic CLI assistant for understanding and safely modifying inherited Python codebases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paul Bontempo" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tree-sitter~=0.25.2",
    "tree-sitter-python>=0.21",
    "networkx>=3.3",
    "pathspec>=0.12",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "langgraph>=1.2",
    "langchain-core>=1.4.7",
    "anthropic>=0.30",
    "openai>=1.35",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
codebase-chat-tool = "codebase_chat_tool.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_chat_tool"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".eval_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]
